server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: wallet-event-consumer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/consumerdb}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:wallet-event-consumer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    topic: ${WALLET_EVENT_TOPIC:wallet.transactions}

logging:
  config: classpath:logback-spring.xml
